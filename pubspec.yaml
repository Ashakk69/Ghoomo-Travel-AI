name: travel_planner
description: A premium travel planner app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.6
  google_generative_ai: ^0.4.0
  url_launcher: ^6.2.5
  flutter_dotenv: ^5.1.0
  shared_preferences: ^2.2.2
  http: ^1.2.0
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  uuid: ^4.3.3
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  permission_handler: ^11.0.1
  local_auth: ^2.1.7
  flutter_secure_storage: ^9.0.0
  smooth_page_indicator: ^1.1.0
  flutter_svg: ^2.0.9
  package_info_plus: ^5.0.1
  # Supabase - replaces Firebase
  supabase_flutter: ^2.3.4
  # UI enhancements
  flutter_card_swiper: ^7.0.0
  shimmer: ^3.0.0
  share_plus: ^7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/ghoomo_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/ghoomo_logo.png"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/destinations/
    - assets/ghoomo_logo.png
