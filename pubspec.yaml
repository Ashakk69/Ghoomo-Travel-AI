name: travel_planner
description: A premium travel planner app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.6
  google_generative_ai: ^0.4.0
  url_launcher: ^6.2.5
  flutter_dotenv: ^5.1.0
  shared_preferences: ^2.2.2
  http: ^1.2.0
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/ghoomo_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/ghoomo_logo.png"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/destinations/
    - assets/ghoomo_logo.png
